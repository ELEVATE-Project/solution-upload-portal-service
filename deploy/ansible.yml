---
- hosts: elevate
  vars:
    project_path: /opt/backend/deployment
    python_version: 3.9
    pm2_app_name: solution-upload-portal-service
    current_path: "{{ project_path }}/solution-upload-portal-service"

  tasks:

    - name: Slurp host file
      slurp:
        src: "{{ project_path }}/.token"
      register: slurpfile

    - name: Get vault credentials
      shell: >
        curl --location --request GET '{{ vaultAddress }}solution-upload-portal-service'
        --header 'X-Vault-Token: {{ slurpfile.content | b64decode }}'
        | jq '.data' > '{{ project_path }}/data2.json'
      register: credentials

    - debug: msg="{{ credentials }}"

    - name: Delete existing project folder (if any)
      file:
        path: "{{ current_path }}"
        state: absent

    - name: Clone the Python repository directly into current path
      git:
        repo: https://github.com/priyanka-TL/solution-upload-portal-service
        dest: "{{ current_path }}"
        version: "{{ gitBranch }}"
        force: yes
      register: git_clone
      failed_when: git_clone.failed

    - name: Create Python virtual environment and install requirements
      shell: |
        /usr/bin/python{{ python_version }} -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
      args:
        chdir: "{{ current_path }}"
        executable: /bin/bash
      register: pip_install
      failed_when: pip_install.rc != 0

    - name: Stop existing PM2 process if running
      command: pm2 stop {{ pm2_app_name }}
      ignore_errors: yes
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin"

    - name: Set permissions for json2env.sh
      shell: chmod 744 {{ current_path }}/scripts/json2env.sh

    - name: Generate .env from Vault data
      shell: >
        cat {{ project_path }}/data2.json | {{ current_path }}/scripts/json2env.sh
        > {{ current_path }}/apiServices/src/main/.env
      register: envConfig

    - debug: msg="cred {{ envConfig }}"

    - name: Start Flask application using PM2
      shell: >
        pm2 start {{ current_path }}/venv/bin/python
        --name "{{ pm2_app_name }}"
        -- {{ current_path }}/apiServices/src/main/app.py
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin"
        PYTHONPATH: "{{ current_path }}"
      register: pm2_start
      failed_when: pm2_start.rc != 0
